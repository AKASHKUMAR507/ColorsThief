<style>
    @layer base {
      html, body {
        width: 100vw;
        min-height: 100vh;
        margin: 0;
        padding: 0;
        font-family: 'Fredoka', cursive, sans-serif;
      }
      body {
        overscroll-behavior: none;
      }
      .pb-safe { padding-bottom: max(env(safe-area-inset-bottom, 16px), 24px); }
      .pt-safe { padding-top: max(env(safe-area-inset-top, 20px), 44px); }
    }
    ::-webkit-scrollbar { display: none; }

    /* Bouncy animations */
    @keyframes heroBounce {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-7px) rotate(1deg); }
    }
    @keyframes armWave {
      0%, 100% { transform: rotate(0deg); }
      50% { transform: rotate(18deg); }
    }
    @keyframes sunSpin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    @keyframes sparkleFloat {
      0%, 100% { opacity: 0.35; transform: scale(0.8) rotate(0deg); }
      50% { opacity: 0.95; transform: scale(1.15) rotate(15deg); }
    }
    @keyframes gentlePulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.02); }
    }

    .animate-hero {
      animation: heroBounce 3.2s ease-in-out infinite;
    }
    .animate-wave {
      transform-origin: 18px 24px;
      animation: armWave 1.4s ease-in-out infinite;
    }
    .animate-sun-rays {
      transform-origin: center;
      animation: sunSpin 24s linear infinite;
    }
    .animate-sparkle {
      animation: sparkleFloat 2.5s ease-in-out infinite;
    }
    .animate-btn-pulse {
      animation: gentlePulse 2s ease-in-out infinite;
    }

    /* Chunky 3D Green Play Button */
    .btn-chunky-green {
      box-shadow: 0 10px 0 #2FA844, 0 18px 24px rgba(26, 26, 46, 0.2);
    }
    .btn-chunky-green:active {
      transform: translateY(6px);
      box-shadow: 0 4px 0 #2FA844, 0 8px 12px rgba(26, 26, 46, 0.22);
    }

    /* Secondary Chunky Buttons */
    .btn-chunky-secondary {
      box-shadow: 0 4px 0 #D4CFCA, 0 6px 10px rgba(26, 26, 46, 0.08);
    }
    .btn-chunky-secondary:active {
      transform: translateY(2px);
      box-shadow: 0 2px 0 #D4CFCA, 0 3px 6px rgba(26, 26, 46, 0.1);
    }

    /* Text stroke helper */
    .text-stroke-title {
      -webkit-text-stroke: 6px #1A1A2E;
      paint-order: stroke fill;
    }
    .text-stroke-sub {
      -webkit-text-stroke: 4px #1A1A2E;
      paint-order: stroke fill;
    }
  </style>
</head>

<button aria-label="Tap to Play" class="btn-chunky-green animate-btn-pulse w-[calc(100%-8px)] h-16 sm:h-[70px] rounded-3xl bg-grass-green border-4 border-navy-outline flex items-center justify-center cursor-pointer transition-transform duration-150 group relative overflow-hidden focus:outline-none active:scale-[0.98]" type="button">
<!-- Top internal glossy highlight -->
<div class="absolute top-1 left-4 right-4 h-6 rounded-full bg-gradient-to-b from-white/60 via-white/20 to-transparent pointer-events-none"></div>
<!-- Text Label "TAP TO PLAY! ▶" in Fredoka One (28px) -->
<div class="relative flex items-center justify-center space-x-2">
<span class="font-fredoka font-bold text-white text-[26px] sm:text-[28px] tracking-wide uppercase drop-shadow-[0_3px_0_#1A1A2E]">
            TAP TO PLAY!
          </span>
<span class="text-white text-2xl sm:text-3xl drop-shadow-[0_3px_0_#1A1A2E] group-hover:translate-x-1 transition-transform">
            ▶
          </span>
</div>
</button>
<!-- Secondary Buttons: Side-by-Side Pill Buttons -->
<div class="w-full flex items-center justify-center space-x-4 pb-1">
<!-- Button 1: For Parents -->
<button aria-label="For Parents" class="btn-chunky-secondary flex-1 max-w-[170px] py-2.5 px-3 rounded-full bg-white border-[2.5px] border-navy-outline text-navy-outline flex items-center justify-center space-x-1.5 hover:bg-warm-cream transition-transform active:scale-95 focus:outline-none" type="button">
<span aria-label="Parents" class="text-base" role="img">👨‍👩‍👧</span>
<span class="font-nunito font-extrabold text-xs sm:text-sm text-navy-outline">For Parents</span>
</button>
<!-- Button 2: Music ON -->
<button aria-label="Music Settings" class="btn-chunky-secondary flex-1 max-w-[170px] py-2.5 px-3 rounded-full bg-white border-[2.5px] border-navy-outline text-navy-outline flex items-center justify-center space-x-1.5 hover:bg-warm-cream transition-transform active:scale-95 focus:outline-none" id="music-toggle" type="button">
<span aria-label="Music Note" class="text-base" role="img">🎵</span>
<span class="font-nunito font-extrabold text-xs sm:text-sm text-navy-outline" id="music-text">Music ON</span>
</button>
</div>
</footer>
</main>
<!-- Interactive Sound Toggle Script -->
<script>
    (function() {
      const musicBtn = document.getElementById('music-toggle');
      const musicText = document.getElementById('music-text');
      let isMusicOn = true;

      if (musicBtn && musicText) {
        musicBtn.addEventListener('click', () => {
          isMusicOn = !isMusicOn;
          musicText.textContent = isMusicOn ? 'Music ON' : 'Music OFF';
          musicBtn.classList.toggle('opacity-75', !isMusicOn);
        });
      }
    })();
  </script>
</body></html>
