    tailwind.config = {

            fredoka: ['Fredoka', 'system-ui', 'sans-serif'],

            cartoon: {
              navy: '#1A1A2E',

          animation: {
            'bounce-gentle': 'gentleBounce 2.5s ease-in-out infinite',
            'float-slow': 'floating 3.5s ease-in-out infinite',
            'wiggle-spin': 'wiggle 2s ease-in-out infinite',
            'pulse-scale': 'pulseScale 1.8s ease-in-out infinite',
            'sparkle-twinkle': 'twinkle 1.6s ease-in-out infinite'
          },
          keyframes: {
            gentleBounce: {
              '0%, 100%': { transform: 'translateY(0)' },
              '50%': { transform: 'translateY(-8px)' }
            },
            floating: {
              '0%, 100%': { transform: 'translateY(0px) rotate(0deg)' },
              '50%': { transform: 'translateY(-10px) rotate(2deg)' }
            },
            wiggle: {
              '0%, 100%': { transform: 'rotate(-3deg)' },
              '50%': { transform: 'rotate(4deg)' }
            },
            pulseScale: {
              '0%, 100%': { transform: 'scale(1)' },
              '50%': { transform: 'scale(1.05)' }
            },
            twinkle: {
              '0%, 100%': { opacity: '0.4', transform: 'scale(0.85)' },
              '50%': { opacity: '1', transform: 'scale(1.2) rotate(15deg)' }
            }
