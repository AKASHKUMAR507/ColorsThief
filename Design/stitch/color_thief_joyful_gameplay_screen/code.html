<!DOCTYPE html><html lang="en"><head>

<link href="https://fonts.googleapis.com" rel="preconnect">
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect">

<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@400..700,0..1&amp;display=swap" rel="stylesheet">
<script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            fredoka: ['Fredoka', 'cursive', 'sans-serif'],
            comfortaa: ['Comfortaa', 'cursive', 'sans-serif'],
            nunito: ['"Nunito Sans"', 'sans-serif'],
          },
          colors: {
            navy: '#1A1A2E',
            navyBorder: '#1A1A2E',
            sunshine: '#FFD23F',
            skyBlue: '#54C8FF',
            grassGreen: '#4CD964',
            coralRed: '#FF6B6B',
            mintSparkle: '#00E5CC',
            softLavender: '#C77DFF',
            hotPink: '#FF4081',

            softGrey: '#A8A8B8',

<style>
    * {
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      -webkit-user-select: none;
      box-sizing: border-box;
    }

    body {
      font-family: 'Fredoka', cursive, sans-serif;
      background-color: #0d0d1a;
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
    }

    /* 9:16 mobile canvas container */
    .mobile-screen {
      width: 100vw;
      max-width: 420px;
      height: 100vh;
      max-height: 890px;
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      background: linear-gradient(180deg, #DCE9F6 0%, #E9F1F8 45%, #DFDCE8 100%);
      border: 8px solid #1A1A2E;
      border-radius: 46px;
      box-shadow: 0 25px 60px -10px rgba(0, 0, 0, 0.65), 0 0 0 1px rgba(255,255,255,0.1);
    }

    /* Cartoon outlines and chunky borders */
    .border-chunky {
      border: 4px solid #1A1A2E;
    }

    .shadow-chunky {
      box-shadow: 0 6px 0px #1A1A2E;
    }

    .shadow-chunky-sm {
      box-shadow: 0 4px 0px #1A1A2E;
    }

    .shadow-chunky-lg {
      box-shadow: 0 8px 0px #1A1A2E;
    }

    /* Toddler Pulse animations for interactive tap targets */
    @keyframes bounceGently {
      0%, 100% { transform: translateY(0px) scale(1); }
      50% { transform: translateY(-8px) scale(1.03); }
    }

    .animate-gentle-bounce {
      animation: bounceGently 2.4s ease-in-out infinite;
    }

    @keyframes tapRingPulse {
      0% { transform: scale(0.9); opacity: 0.9; }
      50% { transform: scale(1.22); opacity: 0.3; }
      100% { transform: scale(0.9); opacity: 0.9; }
    }

    .pulse-ring {
      animation: tapRingPulse 1.8s ease-in-out infinite;
    }

    @keyframes orbWiggle {
      0%, 100% { transform: rotate(0deg) scale(1); }
      25% { transform: rotate(-5deg) scale(1.04); }
      75% { transform: rotate(5deg) scale(1.04); }
    }

    .animate-wiggle {
      animation: orbWiggle 3s ease-in-out infinite;
    }

    @keyframes floatStar {
      0%, 100% { transform: translateY(0px) rotate(0deg) scale(1); }
      50% { transform: translateY(-10px) rotate(18deg) scale(1.15); }
    }

    .animate-star {
      animation: floatStar 2.6s ease-in-out infinite;
    }

    @keyframes sunSpinSlow {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .spin-sun-rays {
      animation: sunSpinSlow 26s linear infinite;
      transform-origin: 320px 85px;
    }

    /* Sparkle Particle explosion on interactive tap */
    .splat-particle {
      position: absolute;
      pointer-events: none;
      border-radius: 9999px;
      z-index: 60;
      animation: splatFade 0.8s cubic-bezier(0.1, 0.8, 0.25, 1) forwards;
    }

    @keyframes splatFade {
      0% { opacity: 1; transform: translate(0, 0) scale(1); }
      100% { opacity: 0; transform: translate(var(--dx), var(--dy)) scale(0.2); }
    }
  </style>
</head>

<!-- ================= 4. AUDIO-VISUAL GAMEPLAY INTERACTION ================= -->
<script>
    let restoredCount = 3;
    const totalTargets = 6;
    let houseColored = false;
    let cloudColored = false;
    let flowersColored = false;

    // Toddler audio pops using HTML5 Web Audio API synthesizers
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

    function playPopSound(freq = 440, type = 'sine') {
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(freq * 1.6, audioCtx.currentTime + 0.12);
      
      gain.gain.setValueAtTime(0.35, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.18);

      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.19);
    }

    function popButton(btn) {
      playPopSound(520, 'triangle');
      btn.style.transform = 'scale(0.9)';
      setTimeout(() => btn.style.transform = '', 150);
    }

    function selectOrb(btn, color) {
      playPopSound(587, 'sine');
      btn.style.transform = 'scale(1.15)';
      setTimeout(() => btn.style.transform = '', 200);
    }

    // Sparkle Particle Splatter effect
    function createSplatters(x, y, palette) {
      const container = document.getElementById('splat-overlay');
      const colors = palette || ['#FFD23F', '#4CD964', '#FF6B6B', '#54C8FF', '#FF4081', '#00E5CC'];
      const count = 22;

      for (let i = 0; i < count; i++) {
        const p = document.createElement('div');
        p.className = 'splat-particle';

        const size = Math.floor(Math.random() * 14) + 10;
        const color = colors[Math.floor(Math.random() * colors.length)];
        const angle = Math.random() * Math.PI * 2;
        const distance = Math.floor(Math.random() * 110) + 40;
        const dx = Math.cos(angle) * distance;
        const dy = Math.sin(angle) * distance;

        p.style.width = `${size}px`;
        p.style.height = `${size}px`;
        p.style.backgroundColor = color;
        p.style.border = '2.5px solid #1A1A2E';
        p.style.left = `${x - size / 2}px`;
        p.style.top = `${y - size / 2}px`;
        p.style.setProperty('--dx', `${dx}px`);
        p.style.setProperty('--dy', `${dy}px`);

        container.appendChild(p);

        setTimeout(() => p.remove(), 850);
      }
    }

    function splatColor(type, defaultX, defaultY, event) {
      playPopSound(660, 'sine');
      const containerRect = document.getElementById('interactive-stage').getBoundingClientRect();
      const clickX = event ? (event.clientX - containerRect.left) : defaultX;
      const clickY = event ? (event.clientY - containerRect.top) : defaultY;

      createSplatters(clickX, clickY, ['#FFD23F', '#FF6B6B', '#4CD964', '#54C8FF']);
    }

    function toggleElementColor(elementName, defaultX, defaultY, event) {
      playPopSound(720, 'triangle');

      // Dismiss toddler hand hint on any active click
      const hand = document.getElementById('hand-hint');
      if (hand) hand.style.display = 'none';

      const containerRect = document.getElementById('interactive-stage').getBoundingClientRect();
      const clickX = event ? (event.clientX - containerRect.left) : defaultX;
      const clickY = event ? (event.clientY - containerRect.top) : defaultY;

      if (elementName === 'house') {
        const walls = document.getElementById('cottage-walls');
        const door = document.getElementById('cottage-door');
        if (!houseColored) {
          walls.setAttribute('fill', '#FFE27A');
          door.setAttribute('fill', '#54C8FF');
          houseColored = true;
          restoredCount = Math.min(6, restoredCount + 1);
          createSplatters(clickX, clickY, ['#FF6B6B', '#FFD23F', '#54C8FF']);
        } else {
          walls.setAttribute('fill', '#FFF4DD');
          door.setAttribute('fill', '#FFD23F');
          houseColored = false;
          restoredCount = Math.max(3, restoredCount - 1);
        }
      } else if (elementName === 'cloud') {
        const body = document.getElementById('cloud-body');
        if (!cloudColored) {
          body.setAttribute('fill', '#FFFFFF');
          cloudColored = true;
          restoredCount = Math.min(6, restoredCount + 1);
          createSplatters(clickX, clickY, ['#54C8FF', '#FFFFFF', '#00E5CC']);
        } else {
          body.setAttribute('fill', '#C8C8D4');
          cloudColored = false;
          restoredCount = Math.max(3, restoredCount - 1);
        }
      } else if (elementName === 'flowers') {
        const f1 = document.querySelector('#flower-1 circle');
        const f2 = document.querySelector('#flower-2 circle');
        const f3 = document.querySelector('#flower-3 circle');
        if (!flowersColored) {
          f1.setAttribute('fill', '#FF4081');
          f2.setAttribute('fill', '#FFD23F');
          f3.setAttribute('fill', '#C77DFF');
          flowersColored = true;
          restoredCount = Math.min(6, restoredCount + 1);
          createSplatters(clickX, clickY, ['#FF4081', '#FFD23F', '#C77DFF', '#4CD964']);
        } else {
          f1.setAttribute('fill', '#C8C8D4');
          f2.setAttribute('fill', '#C8C8D4');
          f3.setAttribute('fill', '#C8C8D4');
          flowersColored = false;
          restoredCount = Math.max(3, restoredCount - 1);
        }
      }

      updateHUD();
    }

    function updateHUD() {
      const fill = document.getElementById('progress-bar-fill');
      const text = document.getElementById('progress-text');
      const pct = Math.round((restoredCount / totalTargets) * 100);
      
      fill.style.width = `${pct}%`;
      text.innerText = `${restoredCount}/${totalTargets}`;

      if (restoredCount === 6) {
        // Grand celebration sound
        setTimeout(() => playPopSound(880, 'sine'), 150);
        setTimeout(() => playPopSound(1046, 'sine'), 300);
      }
    }
  </script>
