<style>
    body {
      font-family: 'Fredoka', 'Nunito', cursive, sans-serif;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    .font-parent {
      font-family: 'Nunito', sans-serif;
    }

    @keyframes floatGentle {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-7px) rotate(1deg); }
    }

    @keyframes jumpJoy {
      0%, 100% { transform: translateY(0) scale(1, 1) rotate(0deg); }
      35% { transform: translateY(-24px) scale(1.08, 0.94) rotate(-5deg); }
      65% { transform: translateY(-10px) scale(0.98, 1.03) rotate(4deg); }
      85% { transform: translateY(0px) scale(1.04, 0.96); }
    }

    @keyframes starPulsePop {
      0% { transform: scale(0) rotate(-40deg); opacity: 0; }
      60% { transform: scale(1.22) rotate(10deg); opacity: 1; }
      80% { transform: scale(0.95) rotate(-3deg); }
      100% { transform: scale(1) rotate(0deg); opacity: 1; }
    }

    @keyframes confettiFlutter {
      0% {
        transform: translateY(-25px) rotate(0deg) scale(0.8);
        opacity: 0;
      }
      15% { opacity: 1; }
      85% { opacity: 0.95; }
      100% {
        transform: translateY(105vh) rotate(540deg) scale(1.1);
        opacity: 0;
      }
    }

    @keyframes ctaBounce {
      0%, 100% { transform: translateY(0) scale(1); }
      50% { transform: translateY(-5px) scale(1.02); }
    }

    @keyframes sparkleSpin {
      0%, 100% { transform: scale(0.7) rotate(0deg); opacity: 0.4; }
      50% { transform: scale(1.2) rotate(90deg); opacity: 1; }
    }

    .animate-float {
      animation: floatGentle 4.5s ease-in-out infinite;
    }

    .animate-jump {
      animation: jumpJoy 2.4s cubic-bezier(0.28, 0.84, 0.42, 1) infinite;
    }

    .animate-cta-bounce {
      animation: ctaBounce 2s ease-in-out infinite;
    }

    .animate-sparkle {
      animation: sparkleSpin 2s ease-in-out infinite;
    }

    .pop-star-1 {
      animation: starPulsePop 0.8s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
      animation-delay: 0.15s;
    }
    .pop-star-2 {
      animation: starPulsePop 0.8s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
      animation-delay: 0.35s;
    }
    .pop-star-3 {
      animation: starPulsePop 0.8s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
      animation-delay: 0.55s;
    }

    .cartoon-card-shadow {
      box-shadow: 0 16px 0px rgba(26, 26, 46, 0.15), 0 28px 45px rgba(255, 107, 107, 0.22);
    }

    .btn-3d-yellow {
      box-shadow: 0 9px 0 #e09b00, 0 16px 24px rgba(255, 210, 63, 0.45);
    }
    .btn-3d-yellow:active {
      transform: translateY(6px);
      box-shadow: 0 3px 0 #e09b00, 0 8px 12px rgba(255, 210, 63, 0.3);
    }

    .btn-3d-circle {
      box-shadow: 0 6px 0 #1A1A2E, 0 10px 18px rgba(26, 26, 46, 0.2);
    }
    .btn-3d-circle:active {
      transform: translateY(4px);
      box-shadow: 0 2px 0 #1A1A2E, 0 6px 10px rgba(26, 26, 46, 0.15);
    }

    .text-stroke-navy {
      -webkit-text-stroke: 3.5px #1A1A2E;
      paint-order: stroke fill;
    }
  </style>
</head>
