<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport"/>
<title>Color Thief — Parent Gate</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&amp;family=Nunito:ital,wght@0,600;0,700;0,800;0,900;1,700&amp;display=swap" rel="stylesheet"/>
<script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            theme: {
              cream: '#FFF9F0',
              card: '#FFFFFF',
              navy: '#1A1A2E',
              muted: '#6B6B8A',
              yellow: '#FFD037',
              yellowSoft: '#FFF3D0',
              mint: '#4ECDC4',
              mintSoft: '#E6FAF8',
              orange: '#FF6B35',
              borderNavy: '#1A1A2E',
              danger: '#FF5C5C',
              dangerBg: '#FFEBEB',
            }
          },
          fontFamily: {
            display: ['Fredoka', 'cursive', 'sans-serif'],
            body: ['Nunito', 'sans-serif'],
          },
          boxShadow: {
            cartoon: '0px 6px 0px #1A1A2E',
            cartoonSm: '0px 3px 0px #1A1A2E',
            cartoonActive: '0px 1px 0px #1A1A2E',
            cartoonCard: '0px 10px 0px #1A1A2E',
          }
        }
      }
    }
  </script>
<style>
    body {
      background-color: #0f111a;
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      font-family: 'Nunito', sans-serif;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      color: #1A1A2E;
    }

    /* iPhone 9:16 Portrait Canvas */
    .phone-container {
      width: 100%;
      max-width: 390px;
      height: 844px;
      background-color: #FFF9F0;
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      box-shadow: 0 25px 60px -15px rgba(0, 0, 0, 0.6);
      border-radius: 48px;
      border: 4px solid #1A1A2E;
    }

    /* Cheerful playful polka dot background */
    .bg-dots {
      background-color: #FFF9F0;
      background-image: radial-gradient(#F3E8D5 18%, transparent 18%), radial-gradient(#F5ECD9 18%, transparent 18%);
      background-size: 28px 28px;
      background-position: 0 0, 14px 14px;
    }

    /* Bouncy cartoon button active state */
    .cartoon-btn {
      transition: transform 0.12s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.12s ease, background-color 0.15s ease;
    }
    .cartoon-btn:active {
      transform: translateY(4px);
      box-shadow: 0px 2px 0px #1A1A2E;
    }

    /* Gentle Shake on incorrect choice */
    @keyframes cartoonShake {
      0%, 100% { transform: translateX(0); }
      20% { transform: translateX(-8px) rotate(-2deg); }
      40% { transform: translateX(8px) rotate(2deg); }
      60% { transform: translateX(-5px) rotate(-1deg); }
      80% { transform: translateX(5px) rotate(1deg); }
    }
    .animate-shake {
      animation: cartoonShake 0.4s cubic-bezier(0.36, 0.07, 0.19, 0.97) both;
    }

    /* Success pop animation */
    @keyframes successPop {
      0% { transform: scale(1); }
      50% { transform: scale(1.1) translateY(-2px); }
      100% { transform: scale(1.03) translateY(-1px); }
    }
    .animate-correct {
      animation: successPop 0.35s ease-out forwards;
    }

    /* Floating subtle animation for decorative elements */
    @keyframes gentleFloat {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-4px) rotate(2deg); }
    }
    .animate-float {
      animation: gentleFloat 3s ease-in-out infinite;
    }
  </style>
</head>
<body>
<div class="phone-container bg-dots">
<!-- Top iOS Safe Area & Dynamic Island (44px) -->
<div class="w-full flex flex-col items-center pt-3 pb-1 shrink-0 z-30 pointer-events-none">
<div class="w-28 h-[22px] bg-[#1A1A2E] rounded-full flex items-center justify-end px-3">
<div class="w-2.5 h-2.5 rounded-full bg-[#1A1A2E] border border-gray-700/60 flex items-center justify-center">
<div class="w-1 h-1 rounded-full bg-[#374151]"></div>
</div>
</div>
</div>
<!-- Navigation Bar -->
<header class="w-full px-5 pt-1 pb-2 flex items-center justify-between shrink-0 z-20">
<!-- Chunky circular close button ('✕') with dark navy border and warm cream surface -->
<button aria-label="Close Parent Gate" class="w-11 h-11 rounded-full bg-white border-[3px] border-theme-borderNavy shadow-cartoonSm text-theme-navy hover:bg-[#FFF3D0] cartoon-btn flex items-center justify-center cursor-pointer" id="closeBtn">
<svg class="w-5 h-5 stroke-current stroke-[3.5]" fill="none" stroke-linecap="round" stroke-linejoin="round" viewbox="0 0 24 24">
<line x1="18" x2="6" y1="6" y2="18"></line>
<line x1="6" x2="18" y1="6" y2="18"></line>
</svg>
</button>
<!-- Screen Title in Fredoka Bold -->
<div class="flex items-center space-x-1.5">
<span class="inline-block w-2.5 h-2.5 rounded-full bg-theme-orange border-2 border-theme-navy"></span>
<h1 class="font-display text-[22px] font-bold text-theme-navy tracking-normal">
          Grown-Ups Only
        </h1>
<span class="inline-block w-2.5 h-2.5 rounded-full bg-theme-yellow border-2 border-theme-navy"></span>
</div>
<!-- Balanced spacer (invisible matching block) -->
<div aria-hidden="true" class="w-11 h-11"></div>
</header>
<!-- Main Screen Flow -->
<main class="flex-1 flex flex-col justify-between px-5 pt-1 pb-4 relative z-10">
<!-- Top Section: Anthropomorphic Friendly Mascot + Instruction -->
<div class="flex flex-col items-center text-center mt-1">
<!-- Anthropomorphic Cartoon Character: Smiling Golden Padlock Mascot with thick 4px outline -->
<div class="relative w-28 h-28 mb-3 flex items-center justify-center animate-float">
<!-- Ambient decorative bubbles/confetti -->
<div class="absolute -top-1 -left-2 w-4 h-4 rounded-full bg-theme-mint border-2 border-theme-navy"></div>
<div class="absolute top-4 -right-2 w-5 h-5 rounded-full bg-theme-yellow border-2 border-theme-navy"></div>
<div class="absolute -bottom-1 right-2 w-3.5 h-3.5 rounded-full bg-theme-orange border-2 border-theme-navy"></div>
<svg class="w-24 h-24 drop-shadow-[0_4px_0_rgba(26,26,46,0.3)]" fill="none" viewbox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
<!-- Lock Shackle (silver/mint accent with thick border) -->
<path d="M32 46V30C32 20.0589 40.0589 12 50 12C59.9411 12 68 20.0589 68 30V46" fill="none" stroke="#1A1A2E" stroke-linecap="round" stroke-width="5"></path>
<path d="M39 44V30C39 23.9249 43.9249 19 50 19C56.0751 19 61 23.9249 61 30V44" fill="none" stroke="#4ECDC4" stroke-linecap="round" stroke-width="4"></path>
<!-- Lock Body (Warm Sunshine Yellow) -->
<rect fill="#FFD037" height="50" rx="18" stroke="#1A1A2E" stroke-width="5" width="64" x="18" y="42"></rect>
<!-- Glossy Highlight Pill -->
<path d="M26 48C26 48 34 46 42 46" stroke="#FFFFFF" stroke-linecap="round" stroke-width="4"></path>
<circle cx="28" cy="55" fill="#FFFFFF" r="2.5"></circle>
<!-- Cute Cheerful Eyes -->
<ellipse cx="38" cy="62" fill="#1A1A2E" rx="4" ry="5"></ellipse>
<circle cx="36.5" cy="60.5" fill="#FFFFFF" r="1.5"></circle>
<ellipse cx="62" cy="62" fill="#1A1A2E" rx="4" ry="5"></ellipse>
<circle cx="60.5" cy="60.5" fill="#FFFFFF" r="1.5"></circle>
<!-- Rosy Cheeks -->
<ellipse cx="30" cy="67" fill="#FF6B35" opacity="0.6" rx="4" ry="2.5"></ellipse>
<ellipse cx="70" cy="67" fill="#FF6B35" opacity="0.6" rx="4" ry="2.5"></ellipse>
<!-- Happy Smile -->
<path d="M44 68C46 72 54 72 56 68" stroke="#1A1A2E" stroke-linecap="round" stroke-width="3.5"></path>
<!-- Keyhole Belly Icon -->
<circle cx="50" cy="79" fill="#1A1A2E" r="3"></circle>
<path d="M48.5 79L47 85H53L51.5 79Z" fill="#1A1A2E"></path>
</svg>
</div>
<!-- Heading Text in Fredoka Rounded Font -->
<h2 class="text-[22px] leading-tight font-display font-bold text-theme-navy tracking-tight mb-1.5">
          Ask a grown-up for help!
        </h2>
<!-- Supportive Subtitle in Nunito Bold -->
<p class="font-body text-[15px] font-bold text-theme-muted max-w-[280px] leading-snug">
          Please solve this quick problem to enter parent settings.
        </p>
</div>
<!-- Verification Challenge Card with thick cartoon outline -->
<div class="w-full bg-white rounded-[32px] p-5 border-[3.5px] border-theme-borderNavy shadow-cartoonCard flex flex-col items-center">
<!-- Verification Pill Label -->
<div class="inline-flex items-center space-x-1.5 bg-theme-yellowSoft border-2 border-theme-borderNavy px-3.5 py-1 rounded-full mb-3 shadow-cartoonSm">
<svg class="w-3.5 h-3.5 text-theme-navy" fill="currentColor" viewbox="0 0 20 20">
<path clip-rule="evenodd" d="M10 1a4.5 4.5 0 00-4.5 4.5V9H5a2 2 0 00-2 2v6a2 2 0 002 2h10a2 2 0 002-2v-6a2 2 0 00-2-2h-.5V5.5A4.5 4.5 0 0010 1zm3 8V5.5a3 3 0 10-6 0V9h6z" fill-rule="evenodd"></path>
</svg>
<span class="font-display font-bold text-xs uppercase tracking-wider text-theme-navy">
            Adult Check
          </span>
</div>
<!-- Math Question in chunky friendly display font -->
<div class="font-display text-[32px] font-bold text-theme-navy tracking-wider my-2 flex items-center justify-center space-x-2">
<span>What is</span>
<span class="bg-[#FFF3D0] px-3 py-1 rounded-2xl border-2 border-theme-navy text-theme-navy inline-block shadow-cartoonSm">
            4 + 3
          </span>
<span>?</span>
</div>
<!-- 4 Large Tactile Answer Option Buttons (Min 68px touch height, thick border) -->
<div class="grid grid-cols-4 gap-2.5 w-full mt-4" id="answerGroup">
<!-- Button 5 -->
<button aria-label="Answer 5" class="answer-btn h-[68px] rounded-2xl bg-white border-[3px] border-theme-borderNavy text-theme-navy font-display font-bold text-3xl flex items-center justify-center shadow-cartoon cartoon-btn hover:bg-yellow-50 cursor-pointer" data-value="5">
            5
          </button>
<!-- Button 6 -->
<button aria-label="Answer 6" class="answer-btn h-[68px] rounded-2xl bg-white border-[3px] border-theme-borderNavy text-theme-navy font-display font-bold text-3xl flex items-center justify-center shadow-cartoon cartoon-btn hover:bg-yellow-50 cursor-pointer" data-value="6">
            6
          </button>
<!-- Button 7 (Correct Answer) -->
<button aria-label="Answer 7" class="answer-btn h-[68px] rounded-2xl bg-white border-[3px] border-theme-borderNavy text-theme-navy font-display font-bold text-3xl flex items-center justify-center shadow-cartoon cartoon-btn hover:bg-yellow-50 cursor-pointer" data-value="7">
            7
          </button>
<!-- Button 8 -->
<button aria-label="Answer 8" class="answer-btn h-[68px] rounded-2xl bg-white border-[3px] border-theme-borderNavy text-theme-navy font-display font-bold text-3xl flex items-center justify-center shadow-cartoon cartoon-btn hover:bg-yellow-50 cursor-pointer" data-value="8">
            8
          </button>
</div>
<!-- Accessible Reactive Feedback Area -->
<div class="h-6 mt-3 font-body font-bold text-sm text-center flex items-center justify-center text-transparent transition-all" id="feedbackText">
          Please try again
        </div>
</div>
<!-- Bottom Advisory Note & iOS Safe Area Bottom Bar (44px safe zone) -->
<div class="flex flex-col items-center text-center mt-2 shrink-0 pb-1">
<div class="flex items-center space-x-2 px-3 py-1 bg-white/70 rounded-full border border-[#EADBCA]">
<svg class="w-4 h-4 text-theme-navy shrink-0" fill="none" stroke="currentColor" stroke-width="2.5" viewbox="0 0 24 24">
<path d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
<p class="font-body text-xs font-bold text-theme-muted">
            This check helps keep your child safe in the game.
          </p>
</div>
<!-- iOS Safe Area Indicator Bar -->
<div class="w-36 h-1.5 bg-theme-navy/20 rounded-full mt-4"></div>
</div>
</main>
</div>
<script>
    // Parent Gate Interactive Verification
    const correctAnswer = "7";
    const answerButtons = document.querySelectorAll('.answer-btn');
    const feedbackText = document.getElementById('feedbackText');
    const closeBtn = document.getElementById('closeBtn');
    let isProcessing = false;

    answerButtons.forEach(btn => {
      btn.addEventListener('click', () => {
        if (isProcessing) return;

        const val = btn.getAttribute('data-value');

        if (val === correctAnswer) {
          isProcessing = true;
          // Correct answer: warm sunshine yellow highlight, cartoon active pop, success badge
          btn.classList.remove('bg-white', 'hover:bg-yellow-50');
          btn.classList.add('bg-theme-yellow', 'text-theme-navy', 'animate-correct');
          
          feedbackText.textContent = "Great! Access granted ✨";
          feedbackText.className = "h-6 mt-3 font-body font-extrabold text-sm text-center flex items-center justify-center text-[#1A1A2E] bg-theme-mintSoft border border-theme-mint px-3 py-0.5 rounded-full transition-all";

          setTimeout(() => {
            feedbackText.textContent = "Opening Settings...";
          }, 900);
        } else {
          // Wrong answer: gentle cartoon shake, cheerful soft danger tint, immediate reset
          isProcessing = true;
          btn.classList.remove('bg-white');
          btn.classList.add('bg-theme-dangerBg', 'text-theme-danger', 'border-theme-danger', 'animate-shake');

          feedbackText.textContent = "Oops! Try another number 😊";
          feedbackText.className = "h-6 mt-3 font-body font-extrabold text-sm text-center flex items-center justify-center text-theme-danger transition-all";

          setTimeout(() => {
            btn.classList.remove('bg-theme-dangerBg', 'text-theme-danger', 'border-theme-danger', 'animate-shake');
            btn.classList.add('bg-white', 'text-theme-navy', 'border-theme-borderNavy');
            feedbackText.textContent = "";
            feedbackText.className = "h-6 mt-3 font-body font-bold text-sm text-center flex items-center justify-center text-transparent transition-all";
            isProcessing = false;
          }, 700);
        }
      });
    });

    // Close button dismiss handler
    closeBtn.addEventListener('click', () => {
      feedbackText.textContent = "Returning to game...";
      feedbackText.className = "h-6 mt-3 font-body font-extrabold text-sm text-center flex items-center justify-center text-theme-navy transition-all";
      setTimeout(() => {
        feedbackText.textContent = "";
        feedbackText.className = "h-6 mt-3 font-body font-bold text-sm text-center flex items-center justify-center text-transparent transition-all";
      }, 1000);
    });
  </script>
</body></html>
